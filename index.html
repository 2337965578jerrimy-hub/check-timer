<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check Timer</title>
<meta name="theme-color" content="#f2f3f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="定检计时">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
/* Layout: one column of aircraft cards, each with a severity stripe; sticky toolbar on top */
:root{
  --bg:#f2f3f6; --card:#ffffff; --text:#14161b; --muted:#6b7280; --line:#e4e6eb; --soft:#f6f7f9; --glass-top:rgba(255,255,255,.72); --glass-bot:rgba(255,255,255,.3); --gbtn:rgba(255,255,255,.62); --gbtn-rim:rgba(255,255,255,.9); --gbtn-hi:rgba(255,255,255,.8);
  --accent:#1d5fd6; --on-accent:#ffffff; --btn:#eceef2; --scrim:rgba(10,12,16,.42); --toast:rgba(20,22,27,.92); --on-toast:#ffffff;
  --g:#17914f; --g-bg:#e6f5ec;
  --y:#a86a00; --y-bg:#fdf3dc; --y-bar:#f0a800;
  --r:#cf2027; --r-bg:#fde8e8;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1014; --card:#191c22; --text:#eceef2; --muted:#9aa1ad; --line:#2a2e36; --soft:#20242b; --glass-top:rgba(22,24,30,.72); --glass-bot:rgba(22,24,30,.28); --gbtn:rgba(58,62,72,.55); --gbtn-rim:rgba(255,255,255,.14); --gbtn-hi:rgba(255,255,255,.1);
    --accent:#5d9bff; --on-accent:#0b1220; --btn:#262a32; --scrim:rgba(0,0,0,.6); --toast:rgba(236,238,242,.94); --on-toast:#14161b;
    --g:#3ccf7f; --g-bg:#13301f; --y:#ffc53d; --y-bg:#3a2f12; --y-bar:#f0b400; --r:#ff5c61; --r-bg:#3d1416;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1014; --card:#191c22; --text:#eceef2; --muted:#9aa1ad; --line:#2a2e36; --soft:#20242b; --glass-top:rgba(22,24,30,.72); --glass-bot:rgba(22,24,30,.28); --gbtn:rgba(58,62,72,.55); --gbtn-rim:rgba(255,255,255,.14); --gbtn-hi:rgba(255,255,255,.1);
  --accent:#5d9bff; --on-accent:#0b1220; --btn:#262a32; --scrim:rgba(0,0,0,.6); --toast:rgba(236,238,242,.94); --on-toast:#14161b;
  --g:#3ccf7f; --g-bg:#13301f; --y:#ffc53d; --y-bg:#3a2f12; --y-bar:#f0b400; --r:#ff5c61; --r-bg:#3d1416;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:16px/1.4 var(--font);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 28px;overflow-x:hidden}
/* Status-bar strip (home-screen app on a notched iPhone): same glass as the top bar, not a grey band */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--glass-top);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
/* Top bar: full-width frosted glass with a vertical gradient (solid at the top, clearer below);
   the bottom edge fades out instead of ending in a line */
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;padding-block:10px;
  /* stretch past the body's 8px margin + side padding so the bar spans the whole screen */
  margin-inline:calc(-8px - max(16px, env(safe-area-inset-left, 0px)));padding-inline:calc(8px + max(16px, env(safe-area-inset-left, 0px)));
  padding-bottom:16px;margin-bottom:-6px;
}
header .top{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:640px;margin:0 auto}
#vHome{padding-top:10px}
/* Three views: home (overview), batch (enter all aircraft), detail (one aircraft) */
.view{max-width:640px;margin:0 auto}
.view[hidden]{display:none}
h1{margin:0;line-height:0}
.logo{width:44px;height:44px;display:block;object-fit:contain}
.hbtns{display:flex;gap:6px}
/* Header tools: Liquid Glass capsules like the sub-page nav buttons; + is a round glass button.
   (Only the bar buttons; the 备份 dropdown items keep their own flat style below.) */
.hbtns{align-items:center;gap:8px}
.hbtns > button,.hbtns .mwrap > button{display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 14px;border-radius:999px;
  font-size:14px;font-weight:600;color:var(--text);background:var(--gbtn);border:.5px solid var(--gbtn-rim);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  box-shadow:0 2px 10px rgba(0,0,0,.08),inset 0 1px 0 var(--gbtn-hi)}
.hbtns > button:active,.hbtns .mwrap > button:active{transform:scale(.96)}
/* Icon-only round glass buttons (copy, backup, +) */
.hbtns > button.sq,.hbtns .mwrap > button.sq{width:36px;height:36px;padding:0;justify-content:center}
.hbtns .sq .ic{width:18px;height:18px;stroke-width:2.1}
.hbtns > button.primary{background:var(--gbtn);color:var(--text)}   /* beat the generic blue .primary */
.ic{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sq .ic{width:22px;height:22px;stroke-width:2.2}
.mwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:8;min-width:230px;background:var(--card);border-radius:14px;padding:6px;
  box-shadow:0 8px 28px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.08)}
.menu[hidden]{display:none}
.hbtns .menu button{display:block;width:100%;height:auto;text-align:left;background:none;box-shadow:none;padding:10px 12px;border-radius:10px;white-space:normal}
.hbtns .menu button:hover,.hbtns .menu button:active{background:var(--soft)}
.menu b{display:block;font-size:15px}
.menu span{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.menu .when{margin-top:4px;font-weight:600}
.menu .when.due{color:var(--r)}
/* Red dot on the backup button when a backup is due */
#btnBackup{position:relative}
#btnBackup.due::after{content:"";position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--r);box-shadow:0 0 0 2px var(--card)}
button{font:inherit;font-size:15px;border:0;border-radius:10px;padding:9px 12px;background:var(--btn);color:var(--text);cursor:pointer;white-space:nowrap}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--on-accent)}
button.danger{color:var(--r)}
button.primary.danger{background:var(--r);color:var(--on-accent)}
button.ghost{background:none;color:var(--accent);padding:8px 6px}
input{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--text);min-width:0}

/* Normal ("green") values are not colored; only yellow / red draw the eye. The left stripe and the
   detail-page bar still show green. */
.txt-g{color:var(--text)} .txt-y{color:var(--y)} .txt-r{color:var(--r)}
.ar-ord.txt-g{color:var(--muted);font-weight:500}
.s-g{--bar:var(--g)} .s-y{--bar:var(--y-bar)} .s-r{--bar:var(--r)}
.b-g{background:var(--g)} .b-y{background:var(--y-bar)} .b-r{background:var(--r)}
.chev{color:var(--muted);font-size:22px;font-weight:400;line-height:1}

/* Home: summary tiles, one row per aircraft, fixed entry button at the bottom */
/* Today's date as a large title (iOS Reminders / Health style) */
.today{font-size:20px;font-weight:700;letter-spacing:.3px;margin:0 2px 8px;line-height:1.2}
.today span{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
/* Summary: one line of small hint chips */
.tiles{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tile{display:inline-flex;align-items:baseline;gap:3px;background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.tile b{font-size:13px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
/* One card per aircraft with a gap between; status shown by a small dot (no side stripe) */
.group{display:flex;flex-direction:column;gap:10px}
.arow{position:relative;display:block;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:16px 12px 16px 14px;
  white-space:normal;font-weight:400;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.arow:active{background:var(--soft)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--bar);flex:0 0 8px;margin-right:2px;align-self:center}
.ar-top{display:flex;align-items:center;gap:8px;min-width:0}
/* Registration as a quiet label: grey "B-", medium-weight number part, a little letter-spacing */
/* The registration block may shrink: a long registration gets "…" instead of pushing the time out */
.ar-id{display:flex;flex-direction:column;min-width:0;flex:0 1 auto}
.ar-reg{display:flex;align-items:baseline;min-width:0;font-size:19px;font-weight:700;letter-spacing:.8px;white-space:nowrap;line-height:1.2}
.ar-reg .rt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ar-reg .ar-ok,.ar-reg .ar-note{flex:0 0 auto}
.ar-rem{flex:0 0 auto}
/* Small phones (iPhone SE / mini width): keep the registration whole — "✓ 已录" becomes "✓", time a bit smaller */
@media (max-width: 360px){
  .ar-ok .okt{display:none}
  .ar-ok{margin-left:6px}
  .ar-rem{font-size:21px}
  .ar-rem .u{margin:0 2px 0 1px}
  .ar-reg{font-size:17px;letter-spacing:.3px}
  .ar-note{margin-left:6px}
  .arow{padding-right:10px}
}
.ar-reg .pre{letter-spacing:.8px}
.ar-ok{font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap;letter-spacing:0;margin-left:8px;position:relative;top:-1px}
/* Remaining time as a duration ("57 小时 13 分"): digits in normal weight, units small and grey,
   so it reads as "time left", not as a clock */
.ar-rem{margin-left:auto;font-size:24px;font-weight:600;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1}
.ar-rem .u{font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0;margin:0 3px 0 2px}
.ar-rem .u:last-child{margin-right:0}
.ar-rem .ov-tag{font-size:12px;font-weight:600;margin-right:4px}
.bar{display:block;height:6px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
/* Order line: name left, value right-aligned under the big number (the padding skips the › column) */
.ar-ord{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;font-weight:600;margin-top:7px;padding-left:18px;padding-right:17px;font-variant-numeric:tabular-nums}
.ar-ord .on{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar-ord .ov{flex:0 0 auto;white-space:nowrap}
#vHome{padding-bottom:88px}
#vBatch{padding-bottom:28px}
/* Batch save: right under the list (no empty gap), same capsule style as the home button */
.bsave{display:flex;justify-content:center;margin-top:20px}
.bsave button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:160px;padding:14px 28px;font-size:17px;font-weight:600;
  border-radius:999px;box-shadow:0 6px 18px rgba(29,95,214,.28),0 1px 3px rgba(0,0,0,.12)}
.bsave .ic{width:19px;height:19px;stroke-width:2.4}
/* Floating capsule button, centered (iOS style) */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom, 0px));background:linear-gradient(to bottom, transparent, var(--bg) 45%)}
.bottombar[hidden]{display:none}
.bottombar button{display:inline-flex;align-items:center;gap:7px;padding:14px 28px;font-size:17px;font-weight:600;border-radius:999px;
  box-shadow:0 6px 18px rgba(29,95,214,.28),0 1px 3px rgba(0,0,0,.12)}
.bottombar .ic{width:19px;height:19px;stroke-width:2.4}

/* Sub-page top bar (batch, detail) */
/* Glass layer for both top bars. It lives on ::before so its fade-out mask only affects the
   background, never the bar content (the 备份 dropdown hangs below the bar and must stay visible). */
header::before,.tbar::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(to bottom, var(--glass-top), var(--glass-bot));
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  -webkit-mask-image:linear-gradient(to bottom, #000 calc(100% - 14px), transparent);mask-image:linear-gradient(to bottom, #000 calc(100% - 14px), transparent)}
/* Same gradient frosted glass as the home top bar, full screen width, soft faded bottom edge */
.tbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px calc(8px + max(16px, env(safe-area-inset-left, 0px))) 16px;margin:0 calc(-8px - max(16px, env(safe-area-inset-left, 0px))) -6px;
}
/* Nav buttons in the Liquid Glass style (iOS 26/27): glass capsules with a light rim; 返回 is a round
   glass button with only a chevron. Glyphs use the label color, not blue. */
.tb{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:40px;min-width:40px;padding:0 16px;border-radius:999px;
  font-size:16px;font-weight:600;color:var(--text);background:var(--gbtn);border:.5px solid var(--gbtn-rim);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  box-shadow:0 2px 10px rgba(0,0,0,.08),inset 0 1px 0 var(--gbtn-hi)}
.tb:active{transform:scale(.96)}
.tb.round{width:40px;padding:0}
.tb .ic{width:22px;height:22px;stroke-width:2.4}
/* Date chip: the whole chip is the date picker (input stretched invisibly over it) */
.datechip{position:relative;display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:16px;padding:6px 10px;border-radius:10px;background:var(--card);cursor:pointer;white-space:nowrap}
.datechip.past{background:var(--y-bg);color:var(--y)}
.datechip .ic{width:15px;height:15px;color:var(--muted)}
.datechip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}
.datechip input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}

/* Batch entry */
/* Date chip in the batch nav bar: same glass capsule as 取消 */
.tbar .datechip{height:40px;padding:0 14px;border-radius:999px;background:var(--gbtn);border:.5px solid var(--gbtn-rim);
  box-shadow:0 2px 10px rgba(0,0,0,.08),inset 0 1px 0 var(--gbtn-hi);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px)}
.tbar .datechip.past{background:var(--y-bg)}
#vBatch .bgroup{margin-top:16px}
/* One grouped list, hairline separators from the text edge, borderless right-aligned fields */
.brow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;min-height:60px;cursor:text}
.brow + .brow::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--line)}
.brow .bl{min-width:0}
.brow b{display:block;font-size:17px;font-weight:700;letter-spacing:.8px}
.brow small{display:block;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
.brow small .ok{color:var(--muted);opacity:.75;margin-left:8px}
/* Time field: a soft rounded box (iOS filled field), blue ring while typing */
.brow input{width:100px;flex:0 0 100px;text-align:center;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;
  border:1px solid transparent;background:var(--soft);padding:8px 6px;border-radius:10px}
.brow input::placeholder{color:var(--muted);opacity:.55;font-weight:500}
.brow input:focus{outline:none;border-color:var(--accent);background:var(--card);color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent)}
.bfoot{font-size:13px;color:var(--muted);margin:8px 14px 0;line-height:1.5}

/* Detail: large title, hero card, iOS grouped sections */
.dreg{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:800;letter-spacing:.8px;word-break:break-all;margin:2px 2px 0}
.dreg .sdot{width:10px;height:10px;flex:0 0 10px}
.dhero{background:var(--card);border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.dhero .lbl{font-size:13px;color:var(--muted)}
.dhero .num{font-size:36px;font-weight:600;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
.dhero .num .u{font-size:15px;font-weight:400;color:var(--muted);margin:0 4px 0 3px;letter-spacing:0}
.dhero .num .ov-tag{font-size:15px;font-weight:600;margin-right:6px}
.dhero .bar{margin-top:12px}
.dstats{display:flex;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.dstats > div{flex:1;display:flex;flex-direction:column;gap:2px}
.dstats > div + div{padding-left:14px;border-left:1px solid var(--line)}
.dstats span{font-size:12px;color:var(--muted)}
.dstats b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.dsect{display:flex;align-items:center;justify-content:space-between;margin:22px 14px 7px;font-size:13px;color:var(--muted)}
.dsect button.ghost{font-size:14px;padding:2px 0}
.dentry{display:flex;gap:8px;background:var(--card);border-radius:14px;padding:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.dentry input{flex:1 1 auto;width:0;text-align:center;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;border:0;background:var(--soft)}
.dentry button.primary{flex:0 0 auto;padding-inline:22px;border-radius:10px;font-weight:600}
.glist{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.grow{position:relative;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;min-height:50px}
.grow + .grow::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--line)}
.gmain{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:none;padding:14px 0;text-align:left;font-size:16px;border-radius:0}
.gname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gval{flex:0 0 auto;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.gval.txt-g{color:var(--muted);font-weight:500}
.gdone{flex:0 0 auto;font-size:13px;padding:5px 11px;border-radius:999px;background:var(--soft);color:var(--muted)}
.gadd,.gact{flex:1;background:none;padding:14px 0;text-align:left;font-size:16px;color:var(--accent);border-radius:0}
.gact{text-align:center;font-weight:600}
.box{background:var(--card);border-radius:14px;padding:6px 14px}
.box .rec:last-child{border-bottom:0}
.muted{color:var(--muted);font-size:14px;padding:8px 0}


.presets{display:flex;flex-wrap:wrap;gap:8px}
.presets button{font-size:14px;padding:7px 11px;background:var(--soft);border:1px solid var(--line)}
.presets button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.note{margin:16px 0 0;font-size:13px;color:var(--muted);text-align:center;line-height:1.5}

.empty{color:var(--muted);text-align:center;padding:48px 0}
dialog{border:0;border-radius:16px;padding:18px;background:var(--card);color:var(--text);width:min(92vw,420px);max-height:85vh;overflow:auto}
dialog::backdrop{background:var(--scrim)}
dialog h2{font-size:18px;margin:0 0 6px}
dialog label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
dialog input,dialog textarea{width:100%}
/* 16px minimum: iPhone zooms the whole page in when a smaller text field gets focus */
textarea{font:16px/1.4 ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--text);height:140px}
#nText{font:16px/1.5 var(--font);height:130px;margin-top:10px;padding:10px 12px;resize:vertical}
/* Notes on the detail page; small note badge on the home row */
.gnote{flex:1;min-width:0;display:block;background:none;padding:12px 0;text-align:left;border-radius:0;white-space:normal}
.gnote .nt{display:block;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.gnote .nd{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.ar-note{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);margin-left:8px;position:relative;top:-1px;letter-spacing:0}
.ar-note .ic{width:14px;height:14px;stroke-width:2}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{flex:1;background:none;padding:8px}
.seg button.on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.dbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.err{font-size:13px;color:var(--r);margin-top:8px;min-height:1em}
.msg{white-space:pre-wrap;font-size:16px;line-height:1.5}
.msg .warn{color:var(--r);font-weight:600}
.msg .note-y{display:block;font-size:14px;color:var(--y);background:var(--y-bg);border-radius:8px;padding:6px 8px}
.msg input{display:block;width:100%;margin-top:8px;font-size:20px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.msg .hint{display:block}
.rec{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
.rec.old{opacity:.45}
.rec .set{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);
  background:var(--toast);color:var(--on-toast);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

<script>
// LOGIC START

var CHECK_MIN = 100 * 60;

// "2:15" / "2.25" / "2" -> minutes; null if invalid or outside [minM, maxM]
function parseDur(s, minM, maxM) {
  s = String(s == null ? '' : s).trim().replace('：', ':');
  if (!s) return null;
  var m;
  if (/^\d{1,6}:\d{1,2}$/.test(s)) {
    var p = s.split(':').map(Number);
    if (p[1] >= 60) return null;
    m = p[0] * 60 + p[1];
  } else if (/^\d*\.?\d+$/.test(s)) {
    m = Math.round(parseFloat(s) * 60);
  } else return null;
  if (m < minM || m > maxM) return null;
  return m;
}

function fmt(min) {
  var a = Math.abs(min);
  var s = Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0');
  return min < 0 ? '-' + s : s;
}

function lastSetIndex(ac) {
  var k = -1;
  ac.events.forEach(function (e, i) { if (e.t === 'set') k = i; });
  return k;
}

// Remaining to check = last 'set' value minus all flights after it
function remaining(ac) {
  var r = null;
  ac.events.forEach(function (e) {
    if (e.t === 'set') r = e.min;
    else if (e.t === 'fly' && r !== null) r -= e.min;
  });
  return r;
}

// Sum of flights dated `day` since the last 'set'
function dayAir(ac, day) {
  var k = lastSetIndex(ac), s = 0;
  ac.events.forEach(function (e, i) { if (i > k && e.t === 'fly' && e.date === day) s += e.min; });
  return s;
}

function dayNum(ymd) {
  var p = ymd.split('-').map(Number);
  return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000);
}

// Hours-type order: start value minus flights entered after the order was created
function orderRemaining(ac, o, today) {
  if (o.type === 'date') return dayNum(o.due) - dayNum(today);
  var r = o.min;
  ac.events.forEach(function (e) { if (e.t === 'fly' && e.ts > o.ts) r -= e.min; });
  return r;
}

// Airframe / engine total: base value plus every flight entered after the base was set.
// base = { min, ts } or undefined (not tracked yet) -> null
function totalTime(ac, base) {
  if (!base || typeof base.min !== 'number') return null;
  var t = base.min;
  ac.events.forEach(function (e) { if (e.t === 'fly' && e.ts > base.ts) t += e.min; });
  return t;
}

// Flights entered for a date (any check cycle)
function enteredOn(ac, day) {
  var s = 0;
  ac.events.forEach(function (e) { if (e.t === 'fly' && e.date === day) s += e.min; });
  return s;
}

function levelHours(min) { return min <= 600 ? 'r' : (min <= 1800 ? 'y' : 'g'); }
function levelDays(d) { return d <= 3 ? 'r' : (d <= 7 ? 'y' : 'g'); }
function worst(levels) {
  if (levels.indexOf('r') >= 0) return 'r';
  if (levels.indexOf('y') >= 0) return 'y';
  return 'g';
}

// Typing helper: keep digits only, last two digits are minutes. "215" -> "2:15", "5" -> "0:05"
// maxDigits defaults to 5 (999:59); airframe / engine fields allow 8 (999999:59)
function fmtTyping(v, maxDigits) {
  var d = String(v == null ? '' : v).replace(/\D/g, '').replace(/^0+/, '').slice(0, maxDigits || 5);
  if (!d) return '';
  d = d.padStart(3, '0');
  return d.slice(0, -2) + ':' + d.slice(-2);
}

// Registration: user types "10AA" -> "B-10AA"; an existing "B-" prefix is kept
function normReg(s) {
  s = String(s == null ? '' : s).toUpperCase().replace(/\s+/g, '');
  if (/^B-/.test(s)) s = s.slice(2);
  s = s.replace(/^-+/, '');
  return s ? 'B-' + s : '';
}

  if (act === 'bsave') { batchSave(); return; }

    var date = entryDate || td;
    var same = sameDay(ac, date);
    var old = same.reduce(function (s, e) { return s + e.min; }, 0);
    if (same.length && old === m) { tell('无需修改', esc(ac.reg) + '　' + mmdd(date) + ' 已录入 ' + fmt(m) + '，和这次一样。'); return; }
    var warns = flightWarnings(ac, same, m, td);

      okText = '修改';

      if (!yes) return;

    });

  } else if (act === 'editnote') {

  if (!$('bText').value.trim()) { $('bErr').textContent = '请先粘贴备份文本'; return; }
  try { s = JSON.parse($('bText').value.trim()); } catch (e) { $('bErr').textContent = '文本格式不对，请确认粘贴的是完整的备份'; return; }
  if (!validState(s)) { $('bErr').textContent = '这不是完整的备份（缺少机号或记录），没有恢复'; return; }
  $('dlgBackup').close();
  ask('恢复备份', '用这份备份覆盖本机当前数据？\n共 ' + s.aircraft.length + ' 架。', { ok: '覆盖', danger: true }).then(function (yes) {
    if (!yes) return;
    state = s; normalize();
    save(); markBackedUp(); render(); toast('已恢复');   // restored data = data that exists in a backup
  });
};

// Auto-format time fields while typing (digits only -> h:mm)
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.classList && el.classList.contains('tm')) el.value = fmtTyping(el.value, +el.dataset.digits || 5);
});

// Live preview of the full registration
function updateRegPreview() {
  var r = normReg($('fReg').value);
  $('fRegPreview').textContent = r ? '显示为 ' + r : '';
}
$('fReg').addEventListener('input', updateRegPreview);

// Refresh day-based values when the page comes back to the foreground (batch form is kept as typed)
document.addEventListener('visibilitychange', function () { if (!document.hidden && view !== 'batch') render(); });

// Re-render once the local date changes (e.g. past midnight); skip while the user is typing in a card
var renderedDay = today();
var _render = render;
render = function () { renderedDay = today(); _render(); };
setInterval(function () {
  if (today() === renderedDay) return;
  if (view === 'batch') return;  // never wipe a half-filled batch form
  var a = document.activeElement;
  if (a && a.closest && a.closest('#app') && a.tagName === 'INPUT') return;
  if (entryDate === renderedDay) entryDate = null;  // was "today": follow the new day
  if (document.querySelector('dialog[open]')) return;
  render();
}, 30000);

load(); render();
</script>
<script>
// Offline support: register the service worker (needs https or localhost)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
